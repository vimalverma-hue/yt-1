<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Yt Channels DP</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0d0d0d;
    color: #fff;
}

/* HEADER */
header {
    padding: 20px;
    text-align: center;
    background: linear-gradient(135deg, #1f1f1f, #121212);
}

header h1 {
    margin: 0;
    font-size: 28px;
}

/* SEARCH */
.search-box {
    text-align: center;
    margin: 20px;
}

.search-box input {
    width: 60%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    outline: none;
    background: #1a1a1a;
    color: #fff;
}

/* GRID */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* CARD */
.card {
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 20px rgba(0,255,255,0.2);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

/* BUTTON */
.download-btn {
    display: block;
    padding: 10px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    text-decoration: none;
    margin: 10px;
    border-radius: 8px;
    transition: 0.3s;
}

.download-btn:hover {
    transform: scale(1.05);
}

/* HIDE */
.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>All Yt Channels DP</h1>
</header>

<!-- SEARCH -->
<div class="search-box">
    <input type="text" id="search" placeholder="Search images..." onkeyup="searchImages()">
</div>

<!-- GALLERY -->
<div class="gallery" id="gallery"></div>

<script>
const folderId = "15JsI_mhkcPdNZbP9aumaCBSJTxXicSf4";

/*
NOTE:
Google Drive direct image listing API requires authentication.
So here we manually define images OR you can paste file IDs below.
*/

// 🔥 ADD YOUR IMAGE FILE IDS HERE
const images = [
    {name: "DP 1", id: "FILE_ID_1"},
    {name: "DP 2", id: "FILE_ID_2"},
    {name: "DP 3", id: "FILE_ID_3"}
];

// Render images
function loadImages() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    images.forEach(img => {
        const imageUrl = `https://drive.google.com/uc?export=view&id=${img.id}`;
        const downloadUrl = `https://drive.google.com/uc?export=download&id=${img.id}`;

        const card = `
        <div class="card" data-name="${img.name.toLowerCase()}">
            <img src="${imageUrl}" alt="${img.name}">
            <a class="download-btn" href="${downloadUrl}">⬇ Download</a>
        </div>
        `;

        gallery.innerHTML += card;
    });
}

// Search function
function searchImages() {
    const input = document.getElementById("search").value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        const name = card.getAttribute("data-name");
        if (name.includes(input)) {
            card.classList.remove("hidden");
        } else {
            card.classList.add("hidden");
        }
    });
}

loadImages();
</script>

</body>
</html>
