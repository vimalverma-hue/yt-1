<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #0d0d0d;
        color: #fff;
    }

    header {
        padding: 20px;
        background: linear-gradient(135deg, #1f1f1f, #121212);
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        text-align: center;
    }

    header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 1px;
    }

    .container {
        padding: 20px;
    }

    .dashboard {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
    }

    .card {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.5);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 25px rgba(0,255,255,0.2);
    }

    .card h2 {
        margin: 0;
        font-size: 22px;
    }

    .card p {
        opacity: 0.7;
    }

    iframe {
        width: 100%;
        height: 600px;
        border: none;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    .btn {
        display: inline-block;
        padding: 12px 20px;
        background: linear-gradient(45deg, #00c6ff, #0072ff);
        color: white;
        border-radius: 8px;
        text-decoration: none;
        margin-top: 20px;
        transition: 0.3s;
    }

    .btn:hover {
        background: linear-gradient(45deg, #00ffcc, #0066ff);
        transform: scale(1.05);
    }

    footer {
        text-align: center;
        padding: 15px;
        font-size: 14px;
        opacity: 0.6;
    }
</style>
</head>

<body>

<header>
    <h1>📂 Google Drive Dashboard</h1>
</header>

<div class="container">

    <!-- Stats Cards -->
    <div class="dashboard">
        <div class="card">
            <h2>📁 Files</h2>
            <p>Access all uploaded files</p>
        </div>

        <div class="card">
            <h2>📊 Dashboard</h2>
            <p>Visual file overview</p>
        </div>

        <div class="card">
            <h2>⚡ Fast Access</h2>
            <p>Quick open & preview</p>
        </div>
    </div>

    <!-- Embedded Drive -->
    <iframe src="https://drive.google.com/embeddedfolderview?id=15JsI_mhkcPdNZbP9aumaCBSJTxXicSf4#grid"></iframe>

    <!-- Download Button -->
    <center>
        <a class="btn" href="https://drive.google.com/drive/folders/15JsI_mhkcPdNZbP9aumaCBSJTxXicSf4" target="_blank">
            ⬇ Open / Download Files
        </a>
    </center>

</div>

<footer>
    Made with ❤️ | Dark Dashboard UI
</footer>

</body>
</html>
